[package]
name = "WSServer"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
warp = "0.3"
env_logger = "0.11"
bytes = "1.12"
rand = "0.10.3"
futures-util = "0.3"
tokio-tungstenite = "0.20"
jsonwebtoken = "9.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

