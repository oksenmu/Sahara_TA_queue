        Simplified floor plan.

        Top    = windows/front of Sahara
        Bottom = entrance/back of Sahara

        The SVG is purely decorative and does not affect
        the positioning of the tables.
    -->

        class="room-plan"
        viewBox="0 0 760 1040"
        preserveAspectRatio="none"
        aria-hidden="true"
    >

        <path
            class="room-fill"
            d="
                M 410 990
                L 720 990
                L 720 130
                L 700 130
                L 700 40
                L 455 40
                L 455 130
                L 315 130
                L 315 40
                L 60 40
                L 60 140
                L 40 140
                L 40 460
                L 335 460
                L 335 620
                L 40 620
                L 40 990
                L 350 990
                z
            "
        />

        <!--
            Walls.

            The bottom wall deliberately stops before and
            after the entrance, leaving a doorway opening.
        -->
        <path
            class="room-wall"
            d="
                M 410 990
                L 720 990
                L 720 130
                L 700 130
                L 700 40
                L 455 40
                L 455 130
                L 315 130
                L 315 40
                L 60 40
                L 60 140
                L 40 140
                L 40 460
                L 335 460
                L 335 620
                L 40 620
                L 40 990
                L 350 990
            "
        />

        <!-- Windows -->
        <line
            class="room-window"
            x1="130"
            y1="40"
            x2="245"
            y2="40"
        />

        <line
            class="room-window"
            x1="525"
            y1="40"
            x2="630"
            y2="40"
        />


        <!-- Door leaf -->
        <line
            class="door-leaf"
            x1="350"
            y1="990"
            x2="350"
            y2="930"
        />

        <!-- Door swing -->
        <path
            class="door-swing"
            d="

                A 60 60 0 0 1 410 990
            "
        />

        <text
            class="room-label entrance-label"
            x="380"
            y="955"
            text-anchor="middle"
        >
            ENTRANCE
        </text>
    </svg>
